name: Render Liquid Glass Promo Video

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      crf:
        description: 'H.264 CRF quality level (lower is higher quality, default 16)'
        required: false
        default: '16'
      gl_renderer:
        description: 'Chromium OpenGL backend (angle, egl, swiftshader)'
        required: false
        default: 'angle'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render Remotion Video (1920x1080 @ 60fps, 35s)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 💾 Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 🎥 Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          # Resolve ALSA sound library for Ubuntu 24.04 (libasound2t64) and Ubuntu 22.04 (libasound2)
          ASOUND_PKG="libasound2t64"
          if ! apt-cache show "$ASOUND_PKG" >/dev/null 2>&1; then
            ASOUND_PKG="libasound2"
          fi
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libnss3 \
            libatk-bridge2.0-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            fonts-liberation \
            fonts-noto-color-emoji \
            "$ASOUND_PKG"

      - name: 📦 Install Node Dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json detected, running npm ci..."
            npm ci || npm install --legacy-peer-deps
          else
            echo "No package-lock.json found, running npm install..."
            npm install --legacy-peer-deps
          fi

      - name: 🔊 Generate Procedural SFX Audio
        run: npm run generate-audio

      - name: 📁 Ensure Output Directory Exists
        run: mkdir -p out

      - name: 🎬 Render Remotion Video (35s, 60fps, 1080p, H.264 / AAC / YUV420p)
        run: |
          GL_BACKEND="${{ github.event.inputs.gl_renderer || 'angle' }}"
          CRF_VAL="${{ github.event.inputs.crf || '16' }}"
          echo "Rendering LiquidGlassPromo (2100 frames) with OpenGL: $GL_BACKEND and CRF: $CRF_VAL..."
          npx remotion render src/remotion-index.ts LiquidGlassPromo out/liquid-glass-promo.mp4 \
            --codec=h264 \
            --pixel-format=yuv420p \
            --audio-codec=aac \
            --crf="$CRF_VAL" \
            --gl="$GL_BACKEND" \
            --concurrency=50% \
            --log=info

      - name: 📊 Rigorous Video File Integrity Verification
        run: |
          echo "Verifying rendered MP4 file integrity and container header..."
          ls -lh out/liquid-glass-promo.mp4
          # Inspect container streams
          ffprobe -hide_banner out/liquid-glass-promo.mp4
          # Decode every video and audio frame to verify zero corruption
          ffmpeg -v error -i out/liquid-glass-promo.mp4 -f null -
          echo "✓ MP4 integrity verified: Zero corrupted packets or decoded errors!"

      - name: 🚀 Upload Video Artifact (Uncompressed container to prevent zip corruption)
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-promo-1080p60-35s
          path: out/liquid-glass-promo.mp4
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
